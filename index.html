<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="TaskFlow team task board" />
    <title>TaskFlow | Team task board</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="app-header">
        <div>
          <p class="eyebrow">Meridian Labs</p>
          <h1>TaskFlow</h1>
          <p class="subtitle">Keep the team’s work moving.</p>
        </div>
        <button class="primary-button" id="new-card-button" type="button">+ New card</button>
      </header>

      <section class="board" aria-label="Task board">
        <div class="board-column" data-status="todo">
          <div class="column-heading">
            <h2>To Do</h2>
            <span class="count" data-count="todo">0</span>
          </div>
          <div class="card-list" data-list="todo"></div>
        </div>
        <div class="board-column" data-status="in-progress">
          <div class="column-heading">
            <h2>In Progress</h2>
            <span class="count" data-count="in-progress">0</span>
          </div>
          <div class="card-list" data-list="in-progress"></div>
        </div>
        <div class="board-column" data-status="done">
          <div class="column-heading">
            <h2>Done</h2>
            <span class="count" data-count="done">0</span>
          </div>
          <div class="card-list" data-list="done"></div>
        </div>
      </section>
    </main>

    <dialog id="card-dialog" aria-labelledby="dialog-title">
      <form id="card-form">
        <div class="dialog-header">
          <div>
            <p class="eyebrow">Task card</p>
            <h2 id="dialog-title">Create a card</h2>
          </div>
          <button class="icon-button" id="close-dialog-button" type="button" aria-label="Close dialog">×</button>
        </div>
        <label for="card-title">Title</label>
        <input id="card-title" name="title" required maxlength="120" autocomplete="off" />
        <label for="card-assignee">Assigned to</label>
        <select id="card-assignee" name="assignee">
          <option value="">Unassigned</option>
          <option>Alex Morgan</option>
          <option>Jamie Chen</option>
          <option>Priya Shah</option>
          <option>Sam Rivera</option>
          <option>Taylor Kim</option>
        </select>
        <label for="card-status">Column</label>
        <select id="card-status" name="status">
          <option value="todo">To Do</option>
          <option value="in-progress">In Progress</option>
          <option value="done">Done</option>
        </select>
        <div class="dialog-actions">
          <button class="secondary-button" id="cancel-dialog-button" type="button">Cancel</button>
          <button class="primary-button" type="submit">Save card</button>
        </div>
      </form>
    </dialog>

    <template id="card-template">
      <article class="task-card">
        <div class="task-card-content">
          <h3></h3>
          <p class="assignee"></p>
        </div>
        <div class="task-card-actions">
          <button class="text-button edit-card-button" type="button">Edit</button>
          <label class="move-control">
            <span class="sr-only">Move card</span>
            <select class="move-card-select" aria-label="Move card">
              <option value="todo">To Do</option>
              <option value="in-progress">In Progress</option>
              <option value="done">Done</option>
            </select>
          </label>
        </div>
      </article>
    </template>

    <script src="app.js"></script>
  </body>
</html>
